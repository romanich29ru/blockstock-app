name: Publish site to Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - news.json
      - snapshot.json
      - api.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push static site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          exclude_assets: '.github'
          enable_jekyll: false
          commit_message: "publish: ${{ github.event.head_commit.message }}"
