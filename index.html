<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlockStock</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0f1216; --card:#171c22; --card2:#1e252d; --text:#e9eef5; --muted:#8d9aab;
    --up:#34c77b; --down:#f0524d; --accent:#5b9cf8; --line:#26303a;
  }
  body.light{
    --bg:#f4f6f9; --card:#ffffff; --card2:#eef2f7; --text:#131820; --muted:#6b7787;
    --up:#0f9d58; --down:#d32f2f; --accent:#2f6fd0; --line:#dfe5ec;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding:14px 12px calc(20px + env(safe-area-inset-bottom));
  }
  h1{font-size:19px;margin:0 0 2px;font-weight:650;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .card{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:10px;border:1px solid var(--line)}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .tick{font-weight:700;font-size:16px;letter-spacing:.3px}
  .qty{color:var(--muted);font-size:12px;font-weight:400;margin-left:6px}
  .price{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
  .pnl{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
  .meta{color:var(--muted);font-size:12px;margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
  .bar{height:5px;background:var(--card2);border-radius:3px;margin-top:9px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:3px;transition:width .4s}
  .total{background:linear-gradient(135deg,#1b2634,#141a21);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
  body.light .total{background:linear-gradient(135deg,#e8effa,#eef4fb)}
  .total .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .total .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .mini{background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
  body.light .mini{background:rgba(0,0,0,.04)}
  .mini b{display:block;color:var(--text);font-size:14px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
  .sec{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;margin:18px 0 8px;padding-left:2px}
  .lvl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
  .lvl b{color:var(--text);font-weight:600}
  .pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--muted);margin-top:6px}
  .foot{color:var(--muted);font-size:11px;text-align:center;margin-top:16px;line-height:1.5}
  .err{color:var(--down);font-size:13px;padding:10px 0}
</style>
</head>
<body>
<h1>BlockStock <span id="idx" class="flat" style="font-size:13px;font-weight:500"></span></h1>
<div class="sub" id="stamp">загрузка котировок…</div>

<div class="total">
  <div class="lbl">Портфель</div>
  <div class="big" id="totalVal">—</div>
  <div class="up down flat" id="totalPnl" style="font-size:14px;font-weight:650;margin-top:2px">—</div>
  <div class="grid2">
    <div class="mini">Вложено<b id="cost">—</b></div>
    <div class="mini">Кэш<b id="cash">—</b></div>
  </div>
</div>

<div class="sec">Позиции</div>
<div id="positions"></div>

<div class="sec">Уровни</div>
<div class="card" id="levels"><div class="err">—</div></div>

<div class="foot">
  Источник: MOEX ISS · обновление каждые 30 с<br>
  Не инвестиционная рекомендация
</div>

<script>
var ISS = 'https://iss.moex.com/iss';
var CFG = [
  {t:'GAZP', qty:80,  avg:111.43, name:'Газпром'},
  {t:'VTBR', qty:46,  avg:56.30,  name:'ВТБ'},
  {t:'AFKS', qty:400, avg:7.886,  name:'АФК Система'}
];
var CASH_DEFAULT = 460;
var pos = loadPos();
var cash = loadCash();

function loadPos(){
  try{
    var raw = localStorage.getItem('bs_pos');
    if(raw){ var p = JSON.parse(raw); if(Array.isArray(p) && p.length) return p; }
  }catch(e){}
  return JSON.parse(JSON.stringify(CFG));
}
function loadCash(){
  try{
    var v = localStorage.getItem('bs_cash');
    if(v !== null) return parseFloat(v);
  }catch(e){}
  return CASH_DEFAULT;
}
function saveAll(){
  try{ localStorage.setItem('bs_pos', JSON.stringify(pos)); localStorage.setItem('bs_cash', String(cash)); }catch(e){}
}

function fmt(n, d){
  if(n === null || n === undefined || isNaN(n)) return '—';
  d = (d === undefined) ? 2 : d;
  return n.toLocaleString('ru-RU', {minimumFractionDigits:d, maximumFractionDigits:d});
}
function money(n){ return fmt(n, 2) + ' ₽'; }
function signed(n){ return (n > 0 ? '+' : '') + fmt(n, 2); }
function cls(n){ return n > 0 ? 'up' : (n < 0 ? 'down' : 'flat'); }

function getJSON(url, cb){
  var x = new XMLHttpRequest();
  x.open('GET', url, true);
  x.timeout = 15000;
  x.onload = function(){
    if(x.status !== 200){ cb(new Error('HTTP ' + x.status)); return; }
    try{ cb(null, JSON.parse(x.responseText)); }catch(e){ cb(e); }
  };
  x.onerror = function(){ cb(new Error('сеть')); };
  x.ontimeout = function(){ cb(new Error('таймаут')); };
  x.send();
}

function parseBlock(json, name){
  var b = json[name];
  var idx = {};
  for(var i = 0; i < b.columns.length; i++) idx[b.columns[i]] = i;
  return {idx: idx, rows: b.data};
}

function fetchQuotes(tickers, cb){
  var u = ISS + '/engines/stock/markets/shares/boards/TQBR/securities.json?iss.meta=off&iss.only=marketdata&securities=' + tickers.join(',');
  getJSON(u, function(err, json){
    if(err){ cb(err); return; }
    var md = parseBlock(json, 'marketdata'), out = {};
    for(var r = 0; r < md.rows.length; r++){
      var row = md.rows[r], i = md.idx;
      out[row[i.SECID]] = {
        last: row[i.LAST],
        prevChg: row[i.LASTTOPREVPRICE],
        high: row[i.HIGH],
        low: row[i.LOW],
        time: row[i.UPDATETIME]
      };
    }
    cb(null, out);
  });
}

function fetchCandles(ticker, cb){
  var d = new Date(Date.now() - 70 * 86400000);
  var from = d.toISOString().slice(0, 10);
  var u = ISS + '/engines/stock/markets/shares/boards/TQBR/securities/' + ticker + '/candles.json?from=' + from + '&interval=24&iss.meta=off';
  getJSON(u, function(err, json){
    if(err){ cb(err); return; }
    var c = parseBlock(json, 'candles'), closes = [], trs = [];
    for(var r = 0; r < c.rows.length; r++){
      var row = c.rows[r], i = c.idx;
      closes.push(row[i.close]);
      if(r > 0){
        var h = row[i.high], l = row[i.low], pc = c.rows[r-1][c.idx.close];
        trs.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
      }
    }
    function sma(n){
      if(closes.length < n) return null;
      var s = 0;
      for(var k = closes.length - n; k < closes.length; k++) s += closes[k];
      return s / n;
    }
    var atr = null;
    if(trs.length >= 14){
      var s2 = 0;
      for(var k = trs.length - 14; k < trs.length; k++) s2 += trs[k];
      atr = s2 / 14;
    }
    var lo = null, hi = null;
    if(closes.length){
      var w = closes.slice(-20);
      lo = Math.min.apply(null, w); hi = Math.max.apply(null, w);
    }
    cb(null, {sma5: sma(5), sma10: sma(10), sma20: sma(20), atr: atr, lo20: lo, hi20: hi, last: closes[closes.length-1]});
  });
}

function render(quotes, tech){
  var totVal = 0, totCost = 0, html = '';
  for(var i = 0; i < pos.length; i++){
    var p = pos[i];
    var q = quotes[p.t] || {};
    var price = (q.last === null || q.last === undefined) ? null : q.last;
    var val = price === null ? p.qty * p.avg : p.qty * price;
    var cost = p.qty * p.avg;
    totVal += val; totCost += cost;
    var pnl = val - cost;
    var pnlPc = cost ? (pnl / cost * 100) : 0;
    var be = p.avg * 1.006;
    var need = price ? ((be / price - 1) * 100) : null;
    var w = Math.max(0, Math.min(100, 50 + pnlPc * 5));
    var col = pnl > 0 ? 'var(--up)' : (pnl < 0 ? 'var(--down)' : 'var(--muted)');
    html += '<div class="card">'
      + '<div class="row"><div><span class="tick">' + p.t + '</span><span class="qty">' + p.qty + ' шт · ' + fmt(p.avg, 3) + '</span></div>'
      + '<div class="price">' + (price === null ? '—' : fmt(price, 3)) + '</div></div>'
      + '<div class="row" style="margin-top:4px"><div class="meta" style="margin-top:0">'
      + '<span class="' + cls(q.prevChg) + '">' + (q.prevChg === undefined || q.prevChg === null ? '—' : signed(q.prevChg) + '%') + ' за день</span>'
      + '<span>стоимость ' + money(val) + '</span></div>'
      + '<div class="pnl ' + cls(pnl) + '">' + signed(pnl) + ' ₽ · ' + signed(pnlPc) + '%</div></div>'
      + '<div class="bar"><i style="width:' + w + '%;background:' + col + '"></i></div>'
      + '<div class="lvl"><span>безубыток с комиссией</span><b>' + fmt(be, 3) + (need === null ? '' : ' · нужно ' + signed(need) + '%') + '</b></div>'
      + '</div>';
  }
  document.getElementById('positions').innerHTML = html || '<div class="card err">Позиций нет</div>';

  var totPnl = totVal - totCost;
  var totPc = totCost ? totPnl / totCost * 100 : 0;
  document.getElementById('totalVal').textContent = money(totVal + cash);
  var te = document.getElementById('totalPnl');
  te.textContent = signed(totPnl) + ' ₽ · ' + signed(totPc) + '% от вложенного';
  te.className = cls(totPnl);
  document.getElementById('cost').textContent = money(totCost);
  document.getElementById('cash').textContent = money(cash);

  var lv = '';
  for(var t in tech){
    var x = tech[t];
    if(!x) continue;
    lv += '<div style="margin-bottom:10px"><div class="tick" style="font-size:13.5px">' + t + '</div>'
      + '<div class="lvl"><span>SMA5 / SMA10 / SMA20</span><b>' + fmt(x.sma5) + ' / ' + fmt(x.sma10) + ' / ' + fmt(x.sma20) + '</b></div>'
      + '<div class="lvl"><span>ATR14</span><b>' + fmt(x.atr, 3) + (x.last ? ' · ' + fmt(x.atr / x.last * 100, 1) + '% от цены' : '') + '</b></div>'
      + '<div class="lvl"><span>диапазон 20 дней</span><b>' + fmt(x.lo20, 3) + ' — ' + fmt(x.hi20, 3) + '</b></div>'
      + '</div>';
  }
  document.getElementById('levels').innerHTML = lv || '<div class="err">нет данных</div>';
}

function fetchIndex(cb){
  var u = ISS + '/engines/stock/markets/index/boards/SNDX/securities/IMOEX.json?iss.meta=off&iss.only=marketdata';
  getJSON(u, function(err, json){
    if(err){ cb(null); return; }
    var md = parseBlock(json, 'marketdata');
    if(!md.rows.length){ cb(null); return; }
    var i = md.idx, row = md.rows[0];
    cb({last: row[i.CURRENTVALUE], chg: row[i.LASTCHANGEPRCNT]});
  });
}

function refresh(){
  var tickers = [];
  for(var i = 0; i < pos.length; i++) tickers.push(pos[i].t);
  fetchQuotes(tickers, function(err, quotes){
    if(err){
      document.getElementById('stamp').innerHTML = '<span class="down">нет связи с MOEX: ' + err.message + '</span>';
      return;
    }
    var tech = {}, left = tickers.length;
    for(var k = 0; k < tickers.length; k++){
      (function(t){
        fetchCandles(t, function(e2, data){
          if(!e2) tech[t] = data;
          if(--left === 0) finish(quotes, tech);
        });
      })(tickers[k]);
    }
    function finish(q, tc){
      render(q, tc);
      fetchIndex(function(ix){
        var el = document.getElementById('idx');
        if(ix && ix.last){
          el.textContent = 'IMOEX ' + fmt(ix.last, 2) + ' (' + signed(ix.chg) + '%)';
          el.className = cls(ix.chg);
        }
        var t = '';
        for(var key in q){ t = q[key].time; break; }
        document.getElementById('stamp').textContent = 'MOEX ' + (t || '') + ' · обновлено ' + new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
      });
    }
  });
}

var tg = window.Telegram && window.Telegram.WebApp;
if(tg){
  try{
    tg.ready(); tg.expand();
    if(tg.colorScheme === 'light') document.body.classList.add('light');
    if(tg.setHeaderColor) tg.setHeaderColor('secondary_bg_color');
  }catch(e){}
}
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
