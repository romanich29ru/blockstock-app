<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Метки по бумагам</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1115;color:#e8ecf1;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;padding:14px;max-width:560px;margin:0 auto}
.title{font-size:19px;font-weight:700;margin-bottom:3px}
.sub{font-size:12px;color:#8b95a5;margin-bottom:14px}
.card{background:#171a21;border:1px solid #232833;border-radius:18px;padding:16px 18px;margin-bottom:14px}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.tk{font-size:21px;font-weight:800;letter-spacing:.5px}
.px{font-size:21px;font-weight:700}
.chg{font-size:13.5px;font-weight:600;margin-left:7px}
.up{color:#37d67a}.down{color:#ff6b6b}
.dir{font-size:13.5px;color:#b9c3d1;margin-left:auto}
.row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #1f2430;gap:10px}
.row:last-child{border-bottom:0}
.k{color:#7f8a9c;white-space:nowrap}
.v{color:#dfe6ef;font-weight:600;text-align:right}
.rng{position:relative;height:8px;background:#222836;border-radius:6px;margin:10px 0 4px}
.rng-fill{height:100%;background:linear-gradient(90deg,#3b4a63,#5b7bb5);border-radius:6px}
.rng-dot{position:absolute;top:-4px;width:12px;height:16px;background:#e8ecf1;border-radius:4px}
.rng-lab{display:flex;justify-content:space-between;font-size:11.5px;color:#7f8a9c;margin-bottom:6px}
.tape{margin-top:10px;padding-top:8px;border-top:1px dashed #2a3040}
.flow{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:8px 0 4px;background:#222836}
.flow-b{background:#37d67a}.flow-s{background:#ff6b6b}
.tape-lab{display:flex;justify-content:space-between;font-size:11.5px;color:#7f8a9c;margin-bottom:4px}
.foot{font-size:11.5px;color:#5f6878;margin:8px 0 16px;line-height:1.5}
.stamp{font-size:11.5px;color:#8b95a5;margin-top:2px}
</style></head>
<body>
<div class="title">Метки по бумагам</div>
<div class="sub" id="sub">загружаю…</div>
<div id="cards"><div class="card">загружаю данные…</div></div>
<div class="foot">Стакан недоступен (только подписчикам MOEX) — читаем ленту сделок.<br>Не инвестиционная рекомендация.</div>
<script>
var DATA_BASE = 'https://raw.githubusercontent.com/romanich29ru/blockstock-app/main/';
var ITEMS = [];

function num(v, d){ if(v === null || v === undefined || isNaN(v)) return '—'; return Number(v).toFixed(d === undefined ? 2 : d).replace(/\.0+$/, ''); }
function fmtInt(n){ return Number(n || 0).toLocaleString('ru-RU'); }
function clock(ts){
  var d = new Date(ts);
  var day = ('0'+d.getDate()).slice(-2), mon = ('0'+(d.getMonth()+1)).slice(-2);
  var hh = ('0'+d.getHours()).slice(-2), mm = ('0'+d.getMinutes()).slice(-2);
  return day + '.' + mon + ' ' + hh + ':' + mm;
}
function spark(vals){
  if(!vals || vals.length < 2) return '';
  var w = 520, h = 78, lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  var rng = (hi - lo) || 1, pts = [];
  for(var i = 0; i < vals.length; i++){
    pts.push((i/(vals.length-1)*w).toFixed(1) + ',' + (h - (vals[i]-lo)/rng*h).toFixed(1));
  }
  var up = vals[vals.length-1] >= vals[0];
  var color = up ? '#37d67a' : '#ff6b6b';
  var fill = up ? 'rgba(55,214,122,.12)' : 'rgba(255,107,107,.12)';
  var area = '0,' + h + ' ' + pts.join(' ') + ' ' + w + ',' + h;
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">' +
    '<polygon points="' + area + '" fill="' + fill + '"/>' +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="2.2" stroke-linejoin="round"/></svg>';
}
function card(it){
  var cls = it.chg >= 0 ? 'up' : 'down';
  var share = (it.flow && it.flow.buy !== null) ? Math.max(0, Math.min(100, it.flow.buy)) : 50;
  var pos = Math.max(0, Math.min(100, it.pos || 0));
  var delta = (it.flow && it.flow.delta) || 0;
  var html = '<div class="card">';
  html += '<div class="head"><div class="tk">' + it.tk + '</div>';
  html += '<div class="px">' + num(it.price, 3) + '<span class="chg ' + cls + '">' + (it.chg >= 0 ? '+' : '') + num(it.chg) + '%</span></div>';
  html += '<div class="dir">' + it.arrow + ' ' + it.dir + '</div></div>';
  html += spark(it.spark);
  html += '<div class="row"><span class="k">Фаза</span><span class="v">' + it.phase + ' · ' + it.pos + '% дня</span></div>';
  html += '<div class="rng"><div class="rng-fill" style="width:' + pos + '%"></div>' +
          '<div class="rng-dot" style="left:calc(' + pos + '% - 6px)"></div></div>';
  html += '<div class="rng-lab"><span>' + num(it.low, 3) + '</span><span>' + num(it.high, 3) + '</span></div>';
  html += '<div class="row"><span class="k">Уровни</span><span class="v">поддержка ' + it.sup + ' · сопротивление ' + it.res + '</span></div>';
  html += '<div class="row"><span class="k">Средние</span><span class="v">SMA5 ' + num(it.sma5) + ' · SMA10 ' + num(it.sma10) + ' · SMA20 ' + num(it.sma20) + '</span></div>';
  html += '<div class="row"><span class="k">Шум (ATR)</span><span class="v">±' + num(it.atr, 1) + '%</span></div>';
  html += '<div class="tape">';
  html += '<div class="row"><span class="k">Лента</span><span class="v">' + (it.flow ? it.flow.phrase : '—') + '</span></div>';
  html += '<div class="flow"><div class="flow-b" style="width:' + share + '%"></div><div class="flow-s" style="width:' + (100-share) + '%"></div></div>';
  html += '<div class="tape-lab"><span>покупки ' + num(share, 1) + '%</span><span>продажи ' + num(100-share, 1) + '%</span></div>';
  html += '<div class="row"><span class="k">Δ 15 мин</span><span class="v">' + (delta >= 0 ? '+' : '') + fmtInt(delta) + '</span></div>';
  html += '<div class="row"><span class="k">Крупные</span><span class="v">B ' + fmtInt(it.flow ? it.flow.bbig : 0) + ' / S ' + fmtInt(it.flow ? it.flow.sbig : 0) + '</span></div>';
  html += '</div></div>';
  return html;
}
function render(d){
  ITEMS = (d && d.items) || [];
  var box = document.getElementById('cards');
  if(!ITEMS.length){ box.innerHTML = '<div class="card">Нет данных — обновлю на следующем прогоне.</div>'; return; }
  var html = '';
  for(var i = 0; i < ITEMS.length; i++) html += card(ITEMS[i]);
  box.innerHTML = html;
  document.getElementById('sub').textContent = 'данные на ' + clock(d.ts) + ' МСК · лента сделок MOEX';
}
function load(){
  var x = new XMLHttpRequest();
  x.open('GET', DATA_BASE + 'metki.json?t=' + Date.now(), true);
  x.timeout = 15000;
  x.onload = function(){
    if(x.status !== 200) return;
    try{ render(JSON.parse(x.responseText)); }catch(e){}
  };
  x.onerror = function(){ document.getElementById('sub').textContent = 'нет связи — показываю прошлые данные'; };
  try{ x.send(); }catch(e){}
}
load();
setInterval(load, 120000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) load(); });
</script>
</body></html>
